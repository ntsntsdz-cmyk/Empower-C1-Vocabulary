<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f46e5">
<title>Empower C1 — Lesson 1D</title>
<style>
:root{--p:#4f46e5;--ps:#eef2ff;--ok:#059669;--oks:#ecfdf5;--bad:#dc2626;--bads:#fef2f2;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--c:#fff;--bg:#f8fafc;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);min-height:100dvh;padding-bottom:calc(1rem + var(--sb))}
input,textarea,button{font-size:16px;font-family:inherit}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:calc(.75rem + var(--st)) 1rem .9rem;text-align:center;position:sticky;top:0;z-index:50}
.wrap{max-width:720px;margin:0 auto;padding:.75rem}
.stats{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:.4rem .6rem;font-size:.75rem;color:var(--m);margin-bottom:.5rem}
.due{width:100%;text-align:left;padding:.55rem .75rem;border-radius:12px;border:1.5px solid var(--b);background:var(--c);margin-bottom:.6rem;font-size:.82rem;min-height:44px}
.due.has{background:#fffbeb;border-color:#fbbf24}
.bar{display:flex;gap:.5rem;align-items:center;margin-bottom:.55rem}
.tag{margin-left:auto;background:var(--ps);color:var(--p);border-radius:999px;padding:.35rem .7rem;font-size:.78rem;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:180;opacity:0;pointer-events:none}.overlay.show{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;left:0;height:100%;width:min(300px,86vw);background:var(--c);z-index:190;transform:translateX(-105%);transition:.25s;overflow-y:auto}
.menu.open{transform:none}.menu h3{padding:1rem;border-bottom:1px solid var(--b)}
.sec{font-size:.7rem;text-transform:uppercase;color:var(--m);padding:.8rem 1rem .3rem;font-weight:700}
.mi{display:block;width:100%;text-align:left;border:0;background:0;padding:.75rem 1.1rem;font-size:.95rem;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem;margin-bottom:.7rem}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--p);color:#fff;border:0;padding:.55rem .9rem;border-radius:10px;font-weight:600;min-height:42px}
.btn-o{background:transparent;border:1.5px solid var(--p);color:var(--p)}.btn-s{padding:.4rem .7rem;font-size:.8rem;min-height:36px}
.quick .btn{width:100%;font-size:.78rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem}
@media(min-width:400px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--c);border:1.5px solid var(--b);border-radius:12px;padding:.7rem .35rem;text-align:center;min-height:72px;position:relative}
.panel{display:none;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:1rem;margin-top:.75rem}.panel.show{display:block}
.def{background:#f1f5f9;border-left:3px solid var(--p);padding:.7rem;border-radius:0 10px 10px 0;margin:.5rem 0}
.ex{background:var(--oks);border-left:3px solid var(--ok);padding:.65rem;border-radius:0 10px 10px 0;margin:.4rem 0;font-style:italic}
.fb{margin-top:.6rem;padding:.65rem;border-radius:12px;display:none}.fb.show{display:block}.fb.ok{background:var(--oks);color:#065f46}.fb.bad{background:var(--bads);color:#991b1b}.fb.info{background:#eff6ff;color:#1e40af}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.mc{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:92dvh;overflow-y:auto;padding:1.1rem 1rem calc(1.2rem + var(--sb))}
.opt{display:block;width:100%;text-align:left;padding:.75rem;border:1.5px solid var(--b);border-radius:12px;margin:.35rem 0;background:var(--c)}
.chip{background:var(--ps);color:var(--p);border:1.5px solid #c7d2fe;border-radius:999px;padding:.4rem .65rem;font-weight:600;margin:.2rem}
.hk{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem}.hk button{border:1.5px solid var(--b);border-radius:8px;padding:.45rem 0;font-weight:700;min-height:40px;background:var(--c)}
.hl{display:inline-block;min-width:1.1rem;text-align:center;border-bottom:2px solid var(--b);margin:0 .12rem;font-weight:700}
.yg{background:#0f172a;border-radius:12px;min-height:200px;position:relative;margin:.5rem 0}
#yg-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8}
footer{text-align:center;font-size:.75rem;color:var(--m);padding:1rem}
</style>
</head>
<body>
<header><h1>Empower C1</h1><p>Lesson 1D · Idioms &amp; opinions</p></header>
<div class="wrap">
<div class="bar"><button class="btn btn-o btn-s" id="menuToggle">☰</button><strong style="font-size:.85rem;color:var(--m)">Empower C1</strong><span class="tag">Unit 1 · 1D</span></div>
<div class="stats">✓ <strong id="learnedCount">0</strong>/<span id="totalWords">0</span> · pts <strong id="scoreDisplay">0</strong></div>
<button class="due" id="dueLine"><strong>Due for review</strong> — <span id="dueDetail">Nothing due</span></button>
<div class="quick">
<button class="btn btn-o" data-act="match">🔗 Match</button>
<button class="btn btn-o" data-act="gap">⬜ Gaps</button>
<button class="btn btn-o" data-act="order">🔀 Order</button>
<button class="btn btn-o" data-act="hang">🪢 Hangman</button>
<button class="btn btn-o" data-act="cw">🧩 Crossword</button>
<button class="btn btn-o" data-act="quiz">🎲 Quiz</button>
<button class="btn btn-o" data-act="write">✍️ Write</button>
<button class="btn btn-o" data-act="speak">🗣️ Speak</button>
</div>
<div style="display:flex;gap:.45rem;margin-bottom:.65rem;flex-wrap:wrap"><button type="button" class="btn" id="addWordBtn" style="flex:1;min-width:140px">➕ Add word</button></div>
<div class="grid" id="wordGrid"></div>
<div class="panel" id="practicePanel">
<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
<button class="btn btn-o btn-s" id="backBtn">←</button>
<span id="currentEmoji" style="font-size:1.8rem"></span>
<div style="flex:1"><div id="currentTerm" style="font-weight:700;color:var(--p);font-size:1.15rem"></div><div id="currentPhonetic" style="font-size:.8rem;color:var(--m)"></div></div>
<button class="btn btn-s" id="hearBtn">🔊</button>
<button class="btn btn-o btn-s" id="markLearnedBtn">✓</button>
</div>
<div class="def" id="definitionBox"></div>
<div class="ex" id="exampleBox"></div>
<div id="wordImageWrap" style="display:none;margin:.55rem 0;border-radius:12px;overflow:hidden;background:#e2e8f0;max-height:200px"><img id="wordImage" alt="" style="width:100%;max-height:200px;object-fit:cover;display:block"></div>
<div style="display:flex;flex-wrap:wrap;gap:.35rem;margin:.45rem 0 .7rem">
<button type="button" class="btn btn-o btn-s" id="imgUploadBtn">📷 Upload</button>
<button type="button" class="btn btn-o btn-s" id="imgGoogleBtn">🔎 Google</button>
<button type="button" class="btn btn-o btn-s" id="imgUrlBtn">🔗 Paste URL</button>
<button type="button" class="btn btn-o btn-s" id="imgRemoveBtn">✕ Remove</button>
<input type="file" id="imgFileInput" accept="image/*" style="display:none">
</div>
<div class="yg"><div id="yg-widget"></div><div id="yg-loading">🎬 YouGlish…</div></div>
<button class="btn btn-s" id="ygReloadBtn">↻ Reload</button>
</div>
</div>
<div class="overlay" id="menuOverlay"></div>
<nav class="menu" id="sideMenu">
<h3>Menu <button class="btn btn-o btn-s" id="menuClose" style="float:right">✕</button></h3>
<div class="sec">Study</div>

<button class="mi" data-act="gap">⬜ Gaps</button>
<button class="mi" data-act="order">🔀 Order</button>
<button class="mi" data-act="hang">🪢 Hangman</button>
<button class="mi" data-act="cw">🧩 Crossword</button>
<button class="mi" data-act="quiz">🎲 Quiz</button>
<div class="sec">Activate</div>

<button class="mi" data-act="speak">🗣️ Speak sentences</button>

</nav>
<div class="modal" id="gameModal"><div class="mc" id="gameBody"></div></div>
<div class="modal" id="addWordModal"><div class="mc">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem"><h3>➕ Add new word</h3><button type="button" class="btn btn-o btn-s" id="closeAddWordBtn">Close</button></div>
<label style="font-size:.8rem;color:var(--m)">Term / phrase *</label>
<input id="awTerm" style="width:100%;padding:.55rem;border:1.5px solid var(--b);border-radius:10px;margin:.25rem 0 .55rem">
<label style="font-size:.8rem;color:var(--m)">Definition *</label>
<textarea id="awDef" style="width:100%;min-height:70px;padding:.55rem;border:1.5px solid var(--b);border-radius:10px;margin:.25rem 0 .55rem"></textarea>
<label style="font-size:.8rem;color:var(--m)">Example sentence</label>
<textarea id="awEx" style="width:100%;min-height:60px;padding:.55rem;border:1.5px solid var(--b);border-radius:10px;margin:.25rem 0 .55rem"></textarea>
<label style="font-size:.8rem;color:var(--m)">Phonetic (optional)</label>
<input id="awPhon" style="width:100%;padding:.55rem;border:1.5px solid var(--b);border-radius:10px;margin:.25rem 0 .55rem">
<label style="font-size:.8rem;color:var(--m)">Emoji (optional)</label>
<input id="awEmoji" style="width:100%;padding:.55rem;border:1.5px solid var(--b);border-radius:10px;margin:.25rem 0 .75rem" placeholder="📝" maxlength="4">
<button type="button" class="btn" id="saveAddWordBtn" style="width:100%">Save word</button>
</div></div>
<footer>Isolated · Progress only for 1D · Chrome best for speaking</footer>
<script src="https://youglish.com/public/emb/widget.js" async></script>
<script>
const STORAGE_KEY='empower_c1_1D_v1';
const CUSTOM_KEY=STORAGE_KEY+'_custom';
const IMAGE_KEY=STORAGE_KEY+'_images';
const builtInWords=[
{term:"bite your tongue",phonetic:"/baɪt jə tʌŋ/",definition:"stop yourself saying something that could start a fight",example:"I bit my tongue when he criticized my work.",emoji:"🤐"},
{term:"fight tooth and nail",phonetic:"/faɪt tuːθ ənd neɪl/",definition:"try extremely hard to get or keep something",example:"They fought tooth and nail to save the business.",emoji:"🦷"},
{term:"head and shoulders above",phonetic:"/hed ənd ˈʃəʊldəz əˈbʌv/",definition:"much better than everyone or everything else",example:"She's head and shoulders above the other candidates.",emoji:"🏆"},
{term:"safe pair of hands",phonetic:"/seɪf peə əv hændz/",definition:"someone you can fully trust to handle things well",example:"He's a safe pair of hands, so I gave him the project.",emoji:"🤝"},
{term:"stick your neck out",phonetic:"/stɪk jə nek aʊt/",definition:"take a risk by saying something bold or backing someone",example:"I'll stick my neck out and say this plan won't work.",emoji:"🦒"},
{term:"How can you possibly think that?",phonetic:"/haʊ kən ju ˈpɒsəbli θɪŋk ðæt/",definition:"a strong way to show disbelief or disagreement",example:"How can you possibly think that was a good idea?",emoji:"😲"},
{term:"That's a load of rubbish.",phonetic:"/ðæts ə ləʊd əv ˈrʌbɪʃ/",definition:"a blunt way to say something is completely untrue or nonsense",example:"That's a load of rubbish — the figures don't support it.",emoji:"🗑️"},
{term:"You're spot on there.",phonetic:"/jʊə spɒt ɒn ðeə/",definition:"a way to say someone is exactly right",example:"You're spot on there — that was the main problem.",emoji:"🎯"},
{term:"You've hit the nail on the head.",phonetic:"/juːv hɪt ðə neɪl ɒn ðə hed/",definition:"a way to say someone has described something perfectly",example:"You've hit the nail on the head — that's exactly how I felt.",emoji:"🔨"},
{term:"I would go along with that.",phonetic:"/aɪ wʊd ɡəʊ əˈlɒŋ wɪð ðæt/",definition:"a mild way to agree",example:"I would go along with that, at least for now.",emoji:"👍"},
{term:"I'm in two minds about this.",phonetic:"/aɪm ɪn tuː maɪndz əˈbaʊt ðɪs/",definition:"you can't decide; torn between two views",example:"I'm in two minds about this — both options have risks.",emoji:"🤔"},
{term:"I agree up to a point.",phonetic:"/aɪ əˈɡriː ʌp tə ə pɔɪnt/",definition:"you agree, but not completely",example:"I agree up to a point, but the cost is still too high.",emoji:"⚖️"}
];
let words=builtInWords.slice();
let wordImages={};
function loadCustom(){try{const custom=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]');wordImages=JSON.parse(localStorage.getItem(IMAGE_KEY)||'{}');const map={};builtInWords.forEach(w=>{map[w.term.toLowerCase()]={...w};if(wordImages[w.term])map[w.term.toLowerCase()].image=wordImages[w.term];});(custom||[]).forEach(c=>{if(!c||!c.term)return;map[c.term.toLowerCase()]={term:c.term,phonetic:c.phonetic||'',definition:c.definition||'',example:c.example||'',emoji:c.emoji||'📝',custom:true,image:wordImages[c.term]||c.image||''};});words=Object.values(map);}catch(e){words=builtInWords.slice();}}
function saveCustomList(){const custom=words.filter(w=>w.custom).map(w=>({term:w.term,phonetic:w.phonetic||'',definition:w.definition||'',example:w.example||'',emoji:w.emoji||'📝'}));localStorage.setItem(CUSTOM_KEY,JSON.stringify(custom));localStorage.setItem(IMAGE_KEY,JSON.stringify(wordImages));}
function setWordImage(term,url){if(!term)return;if(url)wordImages[term]=url;else delete wordImages[term];const w=words.find(x=>x.term===term);if(w)w.image=url||'';localStorage.setItem(IMAGE_KEY,JSON.stringify(wordImages));showWordImage(term);}
function showWordImage(term){const wrap=document.getElementById('wordImageWrap');const img=document.getElementById('wordImage');if(!wrap||!img)return;const url=(words.find(w=>w.term===term)||{}).image||wordImages[term]||'';if(url){img.src=url;wrap.style.display='block';img.onerror=()=>{wrap.style.display='none';};}else{wrap.style.display='none';img.removeAttribute('src');}}
function openAddWord(){['awTerm','awDef','awEx','awPhon'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});const em=document.getElementById('awEmoji');if(em)em.value='📝';document.getElementById('addWordModal').classList.add('show');}
function saveAddWord(){const term=(document.getElementById('awTerm').value||'').trim();const definition=(document.getElementById('awDef').value||'').trim();const example=(document.getElementById('awEx').value||'').trim();const phonetic=(document.getElementById('awPhon').value||'').trim();const emoji=(document.getElementById('awEmoji').value||'📝').trim()||'📝';if(!term||!definition){alert('Term and definition are required.');return;}if(words.some(w=>w.term.toLowerCase()===term.toLowerCase())){alert('This term already exists.');return;}words.push({term,definition,example:example||('I used “'+term+'” in a sentence.'),phonetic,emoji,custom:true,image:''});ensureSrs(term);saveCustomList();save();renderGrid();updateStats();document.getElementById('addWordModal').classList.remove('show');alert('Saved. Open the card to attach a picture if you like.');}
let currentIndex=-1,score=0,learned=new Set(),difficult=new Set(),srs={},ygWidget=null,ygReady=false,pendingTerm=null;
function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');score=d.score||0;learned=new Set(d.learned||[]);difficult=new Set(d.difficult||[]);srs=d.srs||{};}catch(e){}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({score,learned:[...learned],difficult:[...difficult],srs}));}
function ensureSrs(t){if(!srs[t])srs[t]={interval:0,repetitions:0,nextReview:Date.now()};return srs[t];}
function srsUpdate(t,q){const c=ensureSrs(t);if(q===0){c.repetitions=0;c.interval=0.01;}else{c.repetitions++;c.interval=c.repetitions===1?1:c.repetitions===2?3:Math.round(c.interval*2.5);}c.nextReview=Date.now()+c.interval*86400000;save();return c;}
function getDue(){return words.filter(w=>ensureSrs(w.term).nextReview<=Date.now());}
function markWrong(t){difficult.add(t);learned.delete(t);save();}
function markLearned(t){learned.add(t);difficult.delete(t);srsUpdate(t,3);save();updateStats();renderGrid();}
function speak(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';speechSynthesis.speak(u);}
function phraseRe(t){return new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'\\b','i');}
function updateStats(){document.getElementById('learnedCount').textContent=learned.size;document.getElementById('totalWords').textContent=words.length;document.getElementById('scoreDisplay').textContent=score;const due=getDue();const line=document.getElementById('dueLine');if(due.length){line.classList.add('has');document.getElementById('dueDetail').textContent=due.length+' due';}else{line.classList.remove('has');document.getElementById('dueDetail').textContent='Nothing due';}}
function renderGrid(){const g=document.getElementById('wordGrid');g.innerHTML='';words.forEach((w,i)=>{const d=document.createElement('div');d.className='card';const b=learned.has(w.term)?'✓':difficult.has(w.term)?'🔥':'';d.innerHTML=(b?`<span style="position:absolute;top:4px;right:6px">${b}</span>`:'')+`<div style="font-size:1.4rem">${w.emoji}</div><div style="font-weight:650;font-size:.72rem">${w.term}</div>`;d.onclick=()=>selectWord(i);g.appendChild(d);});}
function selectWord(i){currentIndex=i;const w=words[i];document.getElementById('practicePanel').classList.add('show');document.getElementById('currentEmoji').textContent=w.emoji||'📝';document.getElementById('currentTerm').textContent=w.term;document.getElementById('currentPhonetic').textContent=w.phonetic||'';document.getElementById('definitionBox').innerHTML='<strong>Definition:</strong> '+w.definition;document.getElementById('exampleBox').innerHTML='<strong>Example:</strong> “'+(w.example||'')+'”';showWordImage(w.term);loadYouGlish(w.term);}
function openModal(h){document.getElementById('gameBody').innerHTML=h;document.getElementById('gameModal').classList.add('show');}
function closeModal(){document.getElementById('gameModal').classList.remove('show');}
function startMatch(){const sel=[...words].sort(()=>Math.random()-.5).slice(0,Math.min(6,words.length));let matched=0,selId=null;openModal(`<div style="display:flex;justify-content:space-between"><h3>🔗 Match</h3><button class="btn btn-o btn-s" id="x">Close</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem"><div id="mt"></div><div id="md"></div></div><p id="ms" style="text-align:center;font-weight:600">0/${sel.length}</p>`);document.getElementById('x').onclick=closeModal;const mt=document.getElementById('mt'),md=document.getElementById('md');[...sel].sort(()=>Math.random()-.5).forEach(w=>{const b=document.createElement('button');b.className='opt';b.textContent=w.term;b.onclick=()=>selId=w.term;mt.appendChild(b);});[...sel].sort(()=>Math.random()-.5).forEach(w=>{const b=document.createElement('button');b.className='opt';b.textContent=w.definition;b.onclick=()=>{if(selId===w.term){b.disabled=true;matched++;document.getElementById('ms').textContent=matched+'/'+sel.length;score+=15;srsUpdate(w.term,2);selId=null;updateStats();save();}else if(selId){srsUpdate(selId,0);markWrong(selId);}};md.appendChild(b);});}
function startGap(){const q=[...words].sort(()=>Math.random()-.5);let i=0,ok=0;function show(){if(i>=q.length){openModal(`<h3>Done</h3><p>${ok}/${q.length}</p><button class="btn" id="x">Close</button>`);document.getElementById('x').onclick=closeModal;return;}const w=q[i];const re=new RegExp(w.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');const g=re.test(w.example)?w.example.replace(re,'______'):w.definition;openModal(`<h3>⬜ Gaps</h3><p>${i+1}/${q.length}</p><div class="def">${g}</div><input id="gi" style="width:100%;padding:.5rem;border:1.5px solid var(--b);border-radius:10px;margin:.4rem 0"><button class="btn btn-s" id="gc">Check</button><div class="fb" id="gf"></div><button class="btn btn-s" id="gn" style="display:none;margin-top:.4rem">Next</button>`);document.getElementById('gc').onclick=()=>{const v=(document.getElementById('gi').value||'').trim().toLowerCase();const fb=document.getElementById('gf');if(v===w.term.toLowerCase()){fb.className='fb show ok';fb.textContent='✅';ok++;srsUpdate(w.term,2);}else{fb.className='fb show bad';fb.textContent='❌ '+w.term;srsUpdate(w.term,0);markWrong(w.term);}document.getElementById('gn').style.display='inline-flex';updateStats();save();};document.getElementById('gn').onclick=()=>{i++;show();};}show();}
function startOrder(){const q=words.filter(w=>w.example.split(/\s+/).length>=3);let i=0,ok=0;function tok(s){return s.match(/[\w'’-]+|[.,!?;:]/g)||[];}function show(){if(i>=q.length){openModal(`<h3>Done</h3><p>${ok}/${q.length}</p><button class="btn" id="x">Close</button>`);document.getElementById('x').onclick=closeModal;return;}const w=q[i];const tokens=tok(w.example);let picked=[];openModal(`<h3>🔀 Order</h3><p>${w.definition}</p><div id="os" style="min-height:40px;border:1.5px dashed var(--b);border-radius:12px;padding:.4rem;margin:.4rem 0"></div><div id="ob"></div><button class="btn btn-s" id="oc">Check</button><div class="fb" id="of"></div><button class="btn btn-s" id="on" style="display:none">Next</button>`);function render(){const os=document.getElementById('os'),ob=document.getElementById('ob');os.innerHTML='';ob.innerHTML='';picked.forEach((t,ix)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{picked.splice(ix,1);render();};os.appendChild(b);});const rem=tokens.slice();picked.forEach(p=>{const ix=rem.indexOf(p);if(ix>=0)rem.splice(ix,1);});rem.sort(()=>Math.random()-.5).forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{picked.push(t);render();};ob.appendChild(b);});}render();document.getElementById('oc').onclick=()=>{const got=picked.join(' ').replace(/\s+([.,!?;:])/g,'$1');const target=tokens.join(' ').replace(/\s+([.,!?;:])/g,'$1');const fb=document.getElementById('of');if(got.toLowerCase()===target.toLowerCase()){fb.className='fb show ok';fb.textContent='✅';ok++;srsUpdate(w.term,2);}else{fb.className='fb show bad';fb.textContent='❌ '+w.example;srsUpdate(w.term,0);}document.getElementById('on').style.display='inline-flex';updateStats();save();};document.getElementById('on').onclick=()=>{i++;show();};}show();}
function startHang(){const q=[...words].sort(()=>Math.random()-.5);let i=0,ok=0;function letters(t){return t.toLowerCase().replace(/[^a-z]/g,'');}function show(){if(i>=q.length){openModal(`<h3>Done</h3><p>${ok}/${q.length}</p><button class="btn" id="x">Close</button>`);document.getElementById('x').onclick=closeModal;return;}const w=q[i];let lives=6,guessed=new Set(),done=false;function draw(){let word='';for(const ch of w.term)word+=`<span class="hl">${/[a-z]/i.test(ch)?(guessed.has(ch.toLowerCase())?ch:'_'):ch}</span>`;document.getElementById('hw').innerHTML=word;document.getElementById('hp').textContent='Lives '+lives;const keys=document.getElementById('hk');keys.innerHTML='';'abcdefghijklmnopqrstuvwxyz'.split('').forEach(L=>{const b=document.createElement('button');b.textContent=L.toUpperCase();if(guessed.has(L))b.disabled=true;b.onclick=()=>{if(done||guessed.has(L))return;guessed.add(L);if(!letters(w.term).includes(L))lives--;draw();if(letters(w.term).split('').every(c=>guessed.has(c))){done=true;ok++;srsUpdate(w.term,2);document.getElementById('hn').style.display='inline-flex';updateStats();save();}else if(lives<=0){done=true;document.getElementById('hf').className='fb show bad';document.getElementById('hf').textContent=w.term;srsUpdate(w.term,0);document.getElementById('hn').style.display='inline-flex';updateStats();save();}};keys.appendChild(b);});}openModal(`<h3>🪢 Hangman</h3><p id="hp"></p><p>${w.definition}</p><div id="hw" style="text-align:center;margin:.5rem;font-size:1.2rem"></div><div class="hk" id="hk"></div><div class="fb" id="hf"></div><button class="btn btn-s" id="hn" style="display:none">Next</button>`);document.getElementById('hn').onclick=()=>{i++;show();};draw();}show();}
function startCw(){const items=[...words].sort(()=>Math.random()-.5).slice(0,8);openModal(`<h3>🧩 Crossword</h3><div id="cl"></div><button class="btn btn-s" id="cc">Check all</button><div class="fb" id="cf"></div>`);const cl=document.getElementById('cl');items.forEach((w,i)=>{const r=document.createElement('div');r.style.margin='.4rem 0';r.innerHTML=`<div style="font-size:.85rem">${i+1}. ${w.definition}</div><input data-i="${i}" style="width:100%;padding:.45rem;border:1.5px solid var(--b);border-radius:10px;margin-top:.25rem">`;cl.appendChild(r);});document.getElementById('cc').onclick=()=>{let ok=0;items.forEach((w,i)=>{const inp=cl.querySelector(`[data-i="${i}"]`);if((inp.value||'').trim().toLowerCase()===w.term.toLowerCase()){ok++;srsUpdate(w.term,2);}else srsUpdate(w.term,0);});document.getElementById('cf').className='fb show info';document.getElementById('cf').textContent=ok+'/'+items.length;updateStats();save();};}
function startQuiz(){const q=[...words].sort(()=>Math.random()-.5);let i=0,ok=0;function show(){if(i>=q.length){openModal(`<h3>Done</h3><p>${ok}/${q.length}</p><button class="btn" id="x">Close</button>`);document.getElementById('x').onclick=closeModal;return;}const w=q[i];const opts=[w.definition];while(opts.length<4){const o=words[Math.floor(Math.random()*words.length)].definition;if(!opts.includes(o))opts.push(o);}opts.sort(()=>Math.random()-.5);openModal(`<h3>🎲 Quiz</h3><p>${i+1}/${q.length}</p><p>What does “${w.term}” mean?</p><div id="qo"></div><button class="btn btn-s" id="qn" style="display:none">Next</button>`);opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{if(o===w.definition){ok++;srsUpdate(w.term,2);}else{srsUpdate(w.term,0);markWrong(w.term);}document.getElementById('qn').style.display='inline-flex';updateStats();save();};document.getElementById('qo').appendChild(b);});document.getElementById('qn').onclick=()=>{i++;show();};}show();}
function startWrite(){const q=[...words].sort(()=>Math.random()-.5);let i=0,ok=0;function show(){if(i>=q.length){openModal(`<h3>Done</h3><p>${ok}/${q.length}</p><button class="btn" id="x">Close</button>`);document.getElementById('x').onclick=closeModal;return;}const w=q[i];openModal(`<h3>✍️ Write</h3><p>${i+1}/${q.length}</p><div class="def"><strong>${w.term}</strong><br>${w.definition}</div><textarea id="awi" style="width:100%;min-height:80px;padding:.5rem;border:1.5px solid var(--b);border-radius:10px"></textarea><button class="btn btn-s" id="awc">Check &amp; correct</button><div class="fb" id="awf"></div><button class="btn btn-s" id="awn" style="display:none">Next</button>`);document.getElementById('awc').onclick=()=>{const t=(document.getElementById('awi').value||'').trim();const fb=document.getElementById('awf');if(phraseRe(w.term).test(t)){fb.className='fb show ok';fb.innerHTML='✅ Good use';ok++;srsUpdate(w.term,2);}else{fb.className='fb show bad';fb.innerHTML='❌ Model: “'+w.example+'”';srsUpdate(w.term,0);markWrong(w.term);}document.getElementById('awn').style.display='inline-flex';updateStats();save();};document.getElementById('awn').onclick=()=>{i++;show();};}show();}
function startSpeak(){const q=[...words].sort(()=>Math.random()-.5);let i=0,ok=0;function show(){if(i>=q.length){openModal(`<h3>Done</h3><p>${ok}/${q.length}</p><button class="btn" id="x">Close</button>`);document.getElementById('x').onclick=closeModal;return;}const w=q[i];openModal(`<h3>🗣️ Speak</h3><p>${i+1}/${q.length}</p><div class="def"><strong>${w.term}</strong><br>${w.definition}</div><button class="btn" id="asr">● Record &amp; check</button><div class="fb" id="asf"></div><p id="ast"></p><button class="btn btn-s" id="asn" style="display:none">Next</button>`);document.getElementById('asr').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('asf').className='fb show info';document.getElementById('asf').textContent='Use Chrome';return;}const r=new SR();r.lang='en-GB';let final='';r.onresult=ev=>{for(let j=ev.resultIndex;j<ev.results.length;j++)if(ev.results[j].isFinal)final+=ev.results[j][0].transcript+' ';document.getElementById('ast').textContent=final;};r.onend=()=>{const heard=final.trim();const fb=document.getElementById('asf');if(phraseRe(w.term).test(heard)){fb.className='fb show ok';fb.innerHTML='✅ '+heard;ok++;srsUpdate(w.term,2);}else{fb.className='fb show bad';fb.innerHTML='❌ Model: “'+w.example+'”';srsUpdate(w.term,0);}document.getElementById('asn').style.display='inline-flex';updateStats();save();};try{r.start();}catch(e){}};document.getElementById('asn').onclick=()=>{i++;show();};}show();}
function startReview(){const due=getDue();const q=due.length?due:words;let i=0;function show(){if(i>=q.length){closeModal();updateStats();return;}const w=q[i];openModal(`<h3>🔁 Review</h3><div style="text-align:center;font-size:1.3rem;font-weight:700;color:var(--p)">${w.term}</div><button class="btn btn-o btn-s" id="rv">See meaning</button><div id="rd" style="display:none" class="def">${w.definition}</div><div style="margin-top:.5rem"><button class="btn btn-s" style="background:#ef4444" id="rh">Hard</button> <button class="btn btn-s" style="background:#f59e0b;color:#111" id="rm">Medium</button> <button class="btn btn-s" style="background:#059669" id="re">Easy</button></div>`);document.getElementById('rv').onclick=()=>document.getElementById('rd').style.display='block';const g=qv=>{if(qv===0)markWrong(w.term);srsUpdate(w.term,qv===0?0:qv===1?1:3);i++;show();};document.getElementById('rh').onclick=()=>g(0);document.getElementById('rm').onclick=()=>g(1);document.getElementById('re').onclick=()=>g(2);}show();}
function onYouglishAPIReady(){ygReady=true;try{ygWidget=new YG.Widget('yg-widget',{width:300,components:255,autoStart:false,events:{onFetchDone:()=>{const l=document.getElementById('yg-loading');if(l)l.style.display='none';}});if(pendingTerm)ygWidget.fetch(pendingTerm,'english');}catch(e){}}
function loadYouGlish(term){const l=document.getElementById('yg-loading');if(l){l.style.display='flex';l.textContent='🎬 '+term;}if(!ygWidget){pendingTerm=term;return;}try{ygWidget.fetch(term,'english');}catch(e){}}
window.onYouglishAPIReady=onYouglishAPIReady;
document.getElementById('menuToggle').onclick=()=>{document.getElementById('sideMenu').classList.add('open');document.getElementById('menuOverlay').classList.add('show');};
document.getElementById('menuClose').onclick=document.getElementById('menuOverlay').onclick=()=>{document.getElementById('sideMenu').classList.remove('open');document.getElementById('menuOverlay').classList.remove('show');};
document.getElementById('backBtn').onclick=()=>document.getElementById('practicePanel').classList.remove('show');
document.getElementById('hearBtn').onclick=()=>{if(currentIndex>=0)speak(words[currentIndex].term);};
document.getElementById('markLearnedBtn').onclick=()=>{if(currentIndex>=0)markLearned(words[currentIndex].term);};
document.getElementById('ygReloadBtn').onclick=()=>{if(currentIndex>=0)loadYouGlish(words[currentIndex].term);};
document.getElementById('addWordBtn').onclick=openAddWord;
document.getElementById('closeAddWordBtn').onclick=()=>document.getElementById('addWordModal').classList.remove('show');
document.getElementById('saveAddWordBtn').onclick=saveAddWord;
document.getElementById('imgUploadBtn').onclick=()=>{if(currentIndex<0){alert('Open a word first.');return;}document.getElementById('imgFileInput').click();};
document.getElementById('imgFileInput').onchange=(e)=>{const f=e.target.files&&e.target.files[0];if(!f||currentIndex<0)return;if(f.size>2.5*1024*1024){alert('Please use an image under ~2.5 MB.');return;}const reader=new FileReader();reader.onload=()=>{setWordImage(words[currentIndex].term,reader.result);};reader.readAsDataURL(f);e.target.value='';};
document.getElementById('imgGoogleBtn').onclick=()=>{if(currentIndex<0){alert('Open a word first.');return;}window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(words[currentIndex].term+' meaning illustration'),'_blank','noopener');alert('Find a picture, then use Paste URL or Upload.');};
document.getElementById('imgUrlBtn').onclick=()=>{if(currentIndex<0){alert('Open a word first.');return;}const url=prompt('Paste image URL (https://…):');if(url&&url.trim())setWordImage(words[currentIndex].term,url.trim());};
document.getElementById('imgRemoveBtn').onclick=()=>{if(currentIndex>=0)setWordImage(words[currentIndex].term,'');};
document.getElementById('dueLine').onclick=startReview;
const acts={match:startMatch,gap:startGap,order:startOrder,hang:startHang,cw:startCw,quiz:startQuiz,write:startWrite,speak:startSpeak,review:startReview};
document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{document.getElementById('sideMenu').classList.remove('open');document.getElementById('menuOverlay').classList.remove('show');(acts[el.dataset.act]||(()=>{}))();});
load();loadCustom();words.forEach(w=>ensureSrs(w.term));renderGrid();updateStats();
</script>
